# Service names, descriptions, and field labels live in strings.json /
# translations/*.json under the "services" key. This file only declares the
# structure (fields, selectors, defaults, requirements).

learn:
  fields:
    transmitter_id:
      selector:
        text:
    timeout:
      default: 60
      selector:
        number:
          min: 1
          mode: box

read_last_code:
  fields:
    transmitter_id:
      selector:
        text:

learn_and_read:
  fields:
    transmitter_id:
      selector:
        text:
    timeout:
      default: 60
      selector:
        number:
          min: 1
          mode: box
    poll_interval:
      default: 1
      selector:
        number:
          min: 1
          mode: box

test_code:
  fields:
    transmitter_id:
      selector:
        text:
    code:
      required: true
      selector:
        text:

generate_code:
  fields:
    protocol:
      required: true
      selector:
        select:
          options:
            - sony_sirc
    command:
      required: true
      selector:
        number:
          min: 0
          mode: box
    device:
      required: true
      selector:
        number:
          min: 0
          mode: box
    bits:
      default: 12
      selector:
        select:
          options:
            - "12"
            - "15"
            - "20"
    extended:
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box
    repeats:
      default: 3
      selector:
        number:
          min: 1
          max: 20
          mode: box
    carrier_frequency:
      selector:
        number:
          min: 1
          mode: box

save_command:
  fields:
    location_id:
      required: true
      selector:
        text:
    ir_device_id:
      required: true
      selector:
        text:
    command_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    code:
      required: true
      selector:
        text:
    verified:
      default: false
      selector:
        boolean:
    feature:
      selector:
        select:
          options:
            - ""
            - power_on
            - power_off
            - power_toggle
            - play
            - pause
            - play_pause_toggle
            - stop
            - next
            - previous
            - fast_forward
            - rewind
            - volume_up
            - volume_down
            - mute
            - unmute
            - mute_toggle
            - source
    source:
      selector:
        object:

