learn:
  name: Start learning
  description: Start IR learning mode on the configured ZHA transmitter.
  fields:
    transmitter_id:
      name: Transmitter ID
      description: Optional normalized transmitter ID. Omit when one transmitter is enabled.
      selector:
        text:
    timeout:
      name: Timeout
      description: Learn window duration in seconds.
      default: 60
      selector:
        number:
          min: 1
          mode: box

read_last_code:
  name: Read last code
  description: Read the last learned IR code from ZHA attribute 0.
  fields:
    transmitter_id:
      name: Transmitter ID
      selector:
        text:

learn_and_read:
  name: Learn and read
  description: Start IR learning and wait until a new IR code appears.
  fields:
    transmitter_id:
      name: Transmitter ID
      selector:
        text:
    timeout:
      name: Timeout
      default: 60
      selector:
        number:
          min: 1
          mode: box
    poll_interval:
      name: Poll interval
      default: 1
      selector:
        number:
          min: 1
          mode: box

test_code:
  name: Test code
  description: Send a raw IR code without saving it.
  fields:
    transmitter_id:
      name: Transmitter ID
      selector:
        text:
    code:
      name: Code
      required: true
      selector:
        text:

save_command:
  name: Save command
  description: Save or replace an IR command in the registry.
  fields:
    location_id:
      name: Location ID
      required: true
      selector:
        text:
    ir_device_id:
      name: IR device ID
      required: true
      selector:
        text:
    command_id:
      name: Command ID
      required: true
      selector:
        text:
    name:
      name: Name
      required: true
      selector:
        text:
    code:
      name: Code
      required: true
      selector:
        text:
    verified:
      name: Verified
      default: false
      selector:
        boolean:

send_command:
  name: Send command
  description: Send a saved IR command through the configured ZHA transmitter.
  fields:
    transmitter_id:
      name: Transmitter ID
      selector:
        text:
    location_id:
      name: Location ID
      required: true
      selector:
        text:
    ir_device_id:
      name: IR device ID
      required: true
      selector:
        text:
    command_id:
      name: Command ID
      required: true
      selector:
        text:

